Microservicio de **alta precisión** para el pronóstico y alerta de caudales diarios
utilizando arquitecturas de ensamble **Gradient Boosting** y modelos clásicos de series
de tiempo (SARIMA, Holt-Winters, Prophet). Diseñado sobre la estación hidrológica
**Pueblo Nuevo 21117100 (IDEAM)** con serie de entrenamiento 2010–2017 y hold-out de 60 días.

---

\`\`\`

    │  JSON / multipart/form-data
    ▼
FastAPI  app/main.py  (:8000)  +  CORSMiddleware
    │
    ├── GET /health  (Infraestructura)
    │
    └── Router  /api/v1/forecast  (app/routers/forecast.py)

                        │
                        ▼

## Modelos disponibles y métricas (validación out-of-sample, 60 días)

| Modelo        | RMSE   | MAE    | MAPE (%) | NSE      | R²       | MDA (%) |
|---------------|--------|--------|----------|----------|----------|---------|
| **Ensamble**  | 0.0749 | 0.0552 | 2.13     | 0.9991   | 0.9991   | 87.10   |
| Holt-Winters  | 0.3129 | 0.2451 | 9.71     | -1.1148  | -1.1148  | 57.63   |
| SARIMA        | 0.4608 | 0.3512 | 9.32     | -3.4466  | -3.4466  | 57.63   |
| Prophet       | 2.1908 | 1.9234 | 47.83    | -102.685 | -102.685 | 47.46   |

> **NSE** (Nash-Sutcliffe Efficiency): óptimo = 1.0; valores negativos indican peor rendimiento que la media histórica.
> **MDA** (Mean Directional Accuracy): porcentaje de aciertos en la dirección del cambio.

---

## Niveles de alerta hidrológica

Calculados sobre el **caudal medio proyectado** del horizonte seleccionado:

| Nivel      | Condición              | Descripción                          |
|------------|------------------------|--------------------------------------|
| \`LOW\`      | media < 1.5 m³/s       | Caudal bajo, seguimiento de rutina   |
| \`NORMAL\`   | 1.5 ≤ media < 8.0 m³/s | Condiciones normales de operación    |
| \`HIGH\`     | media ≥ 8.0 m³/s       | Caudal elevado, monitoreo intensivo  |

> El módulo \`classifier.py\` implementa 5 niveles de alerta más granulares (ESTIAJE, LOW, MODERATE, HIGH, CRITICAL) basados en percentiles históricos P25–P95 de la estación Pueblo Nuevo, disponibles a través de \`forecast_service.py\`.

---

## Notas de uso

- Se requieren **mínimo 35 registros diarios continuos** para el cálculo de variables de rezago (máximo lag = 30 días + margen de rolling stats).
- Las fechas deben estar en formato **ISO 8601** (\`YYYY-MM-DD\`).
- El horizonte máximo de pronóstico es de **90 días**.
- La serie debe tener **frecuencia diaria estricta** (sin fechas faltantes); el endpoint aplica \`asfreq("D")\` y retorna HTTP 420 si se detectan nulos.
- Los gráficos Plotly (\`plot_historic_html\`, \`plot_forecast_html\`, \`plot_comparison_html\`) se generan internamente pero **no se incluyen en el JSON de respuesta** (son consumidos por el frontend directamente desde \`charts.py\`).
- Entrenar los modelos antes del primer despliegue ejecutando: \`python train_models.py\`
